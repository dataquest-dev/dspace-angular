    label: Deutsch
    active: false
  - code: es
    label: Español
    active: false
  - code: fr
    label: Français
    active: false
  - code: gd
    label: Gàidhlig
    active: false
  - code: lv
    label: Latviešu
    active: false
  - code: hu
    label: Magyar
    active: false
  - code: nl
    label: Nederlands
    active: false
  - code: pl
    label: Polski
    active: false
  - code: pt-PT
    label: Português
    active: false
  - code: pt-BR
    label: Português do Brasil
    active: false
  - code: fi
    label: Suomi
    active: false
  - code: sv
    label: Svenska
    active: false
