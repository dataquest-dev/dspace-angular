# NOTE: in the JCU Docker dev stack these REST values are overridden at runtime by the
# DSPACE_REST_* environment variables set in docker-compose.yml (localhost:8080).
rest:
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

# Languages — JCU repository offers Czech and English only
languages:
  - code: en
    label: English
    active: true
  - code: cs
    label: Čeština
    active: true

# Item view configuration
item:
  bitstream:
    # Per-file access-status label in the Item View ("Embargo until <date>").
    # Off by default in default-app-config.ts; the backend serves the data at
    # /server/api/core/bitstreams/<uuid>/accessStatus.
    showAccessStatuses: true

# Theme Config
themes:
  # See src/themes/custom/ for the styles, header override, fonts and favicons.
  - name: custom
    headTags:
      - tagName: link
        attributes:
          rel: icon
          href: assets/custom/images/favicons/favicon.ico
          sizes: any
      - tagName: link
        attributes:
          rel: icon
          href: assets/custom/images/favicons/favicon.svg
          type: image/svg+xml
      - tagName: link
        attributes:
          rel: apple-touch-icon
          href: assets/custom/images/favicons/apple-touch-icon.png
      - tagName: link
        attributes:
          rel: manifest
          href: assets/custom/images/favicons/manifest.webmanifest

ssr:
  excludePathPatterns:
    - pattern: "^/communities/[a-f0-9-]{36}/browse(/.*)?$"
      flag: "i"
    - pattern: "^/collections/[a-f0-9-]{36}/browse(/.*)?$"
      flag: "i"
    - pattern: "^/browse/"
    - pattern: "^/search"
    - pattern: "^/community-list$"
    - pattern: "^/statistics/?"
    - pattern: "^/admin/"
    - pattern: "^/processes/?"
    - pattern: "^/notifications/"
    - pattern: "^/access-control/"
    - pattern: "^/health$"
    - pattern: "^/collections/[a-f0-9-]{36}/search"
      flag: "i"
    - pattern: "^/communities/[a-f0-9-]{36}/search"
      flag: "i"
    - pattern: "^/(items|entities/[^/]+)/[a-f0-9-]{36}/full/?$"
      flag: "i"
    - pattern: "^/(mydspace|submit|import-external|workspaceitems|workflowitems)(/|$)"
    - pattern: "^/(profile|subscriptions|suggestions)(/|$)"
    - pattern: "^/(items|collections|communities|entities/[^/]+)/[a-f0-9-]{36}/(edit|delete|bitstreams/new)(/|$)"
      flag: "i"
    - pattern: "^/(register|forgot)(/|$)"

cache:
  serverSide:
    debug: false
    botCache:
      max: 512
      timeToLive: 21600000
      allowStale: true
    anonymousCache:
      max: 0
