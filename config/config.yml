# The public URL this UI answers on. DSpace 9.3 feeds its hostname into Angular's SSR
# `allowedHosts`, so leaving it at the `http://localhost:4000` default makes the renderer
# reject every real request and fall back to CSR - HTTP 200 with an empty 1113 B shell.
# Only baseUrl is set here; ui.host/port stay on the defaults the container listens on.
ui:
  baseUrl: https://dspace-new.jcu.cz

# NOTE: in the JCU Docker dev stack these REST values are overridden at runtime by the
# DSPACE_REST_* environment variables set in docker-compose.yml (localhost:8080).
rest:
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

# Languages — JCU repository offers Czech and English only
languages:
  - code: en
    label: English
    active: true
  - code: cs
    label: Čeština
    active: true

# Theme Config
themes:
  # See src/themes/custom/ for the styles, header override, fonts and favicons.
  - name: custom
    headTags:
      - tagName: link
        attributes:
          rel: icon
          href: assets/custom/images/favicons/favicon.ico
          sizes: any
      - tagName: link
        attributes:
          rel: icon
          href: assets/custom/images/favicons/favicon.svg
          type: image/svg+xml
      - tagName: link
        attributes:
          rel: apple-touch-icon
          href: assets/custom/images/favicons/apple-touch-icon.png
      - tagName: link
        attributes:
          rel: manifest
          href: assets/custom/images/favicons/manifest.webmanifest
