# NOTE: in the JCU Docker dev stack these REST values are overridden at runtime by the
# DSPACE_REST_* environment variables set in docker-compose.yml (localhost:8080).
rest:
  ssl: false
  host: localhost
  port: 8080
  nameSpace: /server

# Languages — JCU repository offers Czech and English only
languages:
  - code: en
    label: English
    active: true
  - code: cs
    label: Čeština
    active: true

# Item configuration
item:
  # Access-status badge (Open Access / Embargo / Restricted / Metadata only) on each
  # item in the result lists - search, browse and the recent-items list on the home page.
  showAccessStatuses: true
  bitstream:
    # Per-file access-status label in the Item View ("Embargo until <date>").
    # Both are off by default in default-app-config.ts; the backend serves the data at
    # /server/api/core/{items,bitstreams}/<uuid>/accessStatus.
    showAccessStatuses: true

# Theme Config
themes:
  # See src/themes/custom/ for the styles, header override, fonts and favicons.
  - name: custom
    headTags:
      - tagName: link
        attributes:
          rel: icon
          href: assets/custom/images/favicons/favicon.ico
          sizes: any
      - tagName: link
        attributes:
          rel: icon
          href: assets/custom/images/favicons/favicon.svg
          type: image/svg+xml
      - tagName: link
        attributes:
          rel: apple-touch-icon
          href: assets/custom/images/favicons/apple-touch-icon.png
      - tagName: link
        attributes:
          rel: manifest
          href: assets/custom/images/favicons/manifest.webmanifest

ssr:
  # Hosts allowed to be server-side rendered in addition to ui.baseUrl's hostname (always allowed).
  # The JCU test instance is served behind nginx on dev-6.pc while ui.baseUrl stays http://localhost:4000,
  # so without dev-6.pc listed here SSR falls back to CSR for that host and "not found" pages answer 200
  # instead of 404. Compared by hostname only (port ignored). Harmless in production, where the public
  # hostname already matches ui.baseUrl.
  allowedHosts:
    - dev-6.pc
  excludePathPatterns:
    - pattern: "^/communities/[a-f0-9-]{36}/browse(/.*)?$"
      flag: "i"
    - pattern: "^/collections/[a-f0-9-]{36}/browse(/.*)?$"
      flag: "i"
    - pattern: "^/browse/"
    - pattern: "^/search"
    - pattern: "^/community-list$"
    - pattern: "^/statistics/?"
    - pattern: "^/admin/"
    - pattern: "^/processes/?"
    - pattern: "^/notifications/"
    - pattern: "^/access-control/"
    - pattern: "^/health$"
    - pattern: "^/collections/[a-f0-9-]{36}/search"
      flag: "i"
    - pattern: "^/communities/[a-f0-9-]{36}/search"
      flag: "i"
    - pattern: "^/(items|entities/[^/]+)/[a-f0-9-]{36}/full/?$"
      flag: "i"
    - pattern: "^/(mydspace|submit|import-external|workspaceitems|workflowitems)(/|$)"
    - pattern: "^/(profile|subscriptions|suggestions)(/|$)"
    - pattern: "^/(items|collections|communities|entities/[^/]+)/[a-f0-9-]{36}/(edit|delete|bitstreams/new)(/|$)"
      flag: "i"
    - pattern: "^/(register|forgot)(/|$)"

cache:
  serverSide:
    debug: false
    botCache:
      max: 512
      timeToLive: 21600000
      allowStale: true
    anonymousCache:
      max: 0
