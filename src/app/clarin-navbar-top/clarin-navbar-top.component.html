<div class="clarin-top-header">
  <div class="d-flex">
    <div class="ds-language-selection ps-1 justify-content-between">
      <span class="language-icon" (click)="setLanguage('en')">
        <img src="./assets/images/en.png" alt="{{'language.english' | translate}}" title="{{'language.english' | translate}}">
      </span>
      <span class="language-icon ps-1" (click)="setLanguage('cs')">
        <img src="./assets/images/cs.png" alt="{{'language.czech' | translate}}" title="{{'language.czech' | translate}}">
      </span>
    </div>
    <div class="ms-auto pe-3">
      @if (authenticatedUser == null) {
        <div class="badge clarin-login-badge px-2 py-1">
          <span>
            <a style="color: #FFF;" id="clarin-signon-discojuice" class="signon"
               [style.pointer-events]="scriptsReady ? null : 'none'">
              <i class="fas fa-sign-in-alt pe-1 fa-lg"></i>{{'login.title' | translate}}
            </a>
          </span>
        </div>
      }
      <!-- hidden helper link read by the DiscoJuice script; not user-facing (a11y: aria-hidden) -->
      <a class="hidden" id="repository_path" [href]="repositoryPath" aria-hidden="true" tabindex="-1"></a>
      @if (authenticatedUser != null) {
        <div class="badge clarin-logout-badge px-2 py-1">
          <span>
            <a routerLink="/profile" style="color: #FFF;">
              <i class="fa fa-user pe-1 fa-lg"></i>{{authenticatedUser.name}}
            </a>
          </span>
          <span class="text-white px-1">|</span>
          <a routerLink="/logout" style="color: #FFF;">
            <i class="fas fa-sign-out-alt pe-1 fa-lg" aria-hidden="true"></i>{{'logout.title' | translate}}
          </a>
        </div>
      }
    </div>
  </div>
</div>
