<ng-template #descTemplate>
  <span class="text-muted">
      <span class="item-list-job-title">
        <span [innerHTML]="mdRepresentation.firstMetadataValue(['dc.description'], undefined, true)" [attr.lang]="mdRepresentation.firstMetadata(['dc.description'])?.language | dsLang"></span>
      </span>
  </span>
</ng-template>
<ds-truncatable [id]="mdRepresentation.id">
  <a [routerLink]="[itemPageRoute]"
     [ngbTooltip]="mdRepresentation.hasMetadata(['dc.description']) ? descTemplate : null">{{mdRepresentation.getValue()}}</a>
</ds-truncatable>
