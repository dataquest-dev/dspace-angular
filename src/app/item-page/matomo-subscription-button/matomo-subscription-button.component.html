@if (!isSubscribed) {
  <button
    class="btn btn-outline-info btn-sm"
    (click)="onSubscribe()"
    [dsBtnDisabled]="isLoading"
    [title]="'matomo.subscription.subscribe.tooltip' | translate">
    <i class="fa fa-bell" aria-hidden="true"></i>
    {{ 'matomo.subscription.subscribe.button' | translate }}
  </button>
}
@if (isSubscribed) {
  <button
    class="btn btn-secondary btn-sm"
    (click)="onUnsubscribe()"
    [dsBtnDisabled]="isLoading"
    [title]="'matomo.subscription.unsubscribe.tooltip' | translate">
    <i class="fa fa-bell-slash" aria-hidden="true"></i>
    {{ 'matomo.subscription.unsubscribe.button' | translate }}
  </button>
}
