@if (node.isDirectory) {
  <span>
    <i class="fas fa-folder fa-sm" style="color: #a0a0a0"></i>
    <a role="button" tabindex="0"
      (click)="isCollapsed = !isCollapsed"
      (keyup.enter)="isCollapsed = !isCollapsed"
      (keydown.space)="$event.preventDefault()"
      (keyup.space)="isCollapsed = !isCollapsed"
      [attr.aria-expanded]="!isCollapsed"
      attr.aria-controls="folder_{{ node.name }}">
      {{ node.name }}
    </a>
  </span>
} @else {
  <i class="far fa-file fa-sm pe-1" style="color: #a0a0a0"></i>
  <span>{{ node.name }}</span>
  <span class="size pull-right">{{ node.size }}</span>
}


@if (node.isDirectory && node.sub) {
  <ul id="folder_{{ node.name }}" [ngbCollapse]="isCollapsed">
    @for (subNodeKey of getKeys(node.sub); track subNodeKey) {
      <ds-file-tree-view role="listitem"
        [node]="node.sub[subNodeKey]">
      </ds-file-tree-view>
    }
  </ul>
}
