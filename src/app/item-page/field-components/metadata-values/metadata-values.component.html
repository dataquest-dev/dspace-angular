<ds-metadata-field-wrapper [label]="label | translate">
    <ng-container *ngFor="let mdValue of mdValues; let last=last;">
      <!--
      Choose a template. Priority: ORCID authority, markdown, link, browse link.
      -->
      <ng-container *ngTemplateOutlet="(isOrcidAuthority(mdValue) ? orcidTemplate : (renderMarkdown ? markdown : (hasLink(mdValue) ? link : (hasBrowseDefinition() ? browselink : simple))));
        context: {value: mdValue.value, mdValue: mdValue}">
      </ng-container>
      <span class="separator" *ngIf="!last" [innerHTML]="separator"></span>
    </ng-container>
</ds-metadata-field-wrapper>

<!-- Render value as markdown -->
<ng-template #markdown let-value="value">
  <span class="dont-break-out" [innerHTML]="value | dsMarkdown | async">
  </span>
</ng-template>

<!-- Render value as a link (href and label) -->
<ng-template #link let-value="value">
    <a class="dont-break-out ds-simple-metadata-link"
      [href]="value"
      [attr.target]="getLinkAttributes(value).target"
      [attr.rel]="getLinkAttributes(value).rel"
      role="link"
      tabindex="0">
      {{value}}
    </a>
</ng-template>

<!-- Render simple value in a span  -->
<ng-template #simple let-value="value">
  <span class="dont-break-out preserve-line-breaks">{{value}}</span>
</ng-template>

<!-- Render value as a link to browse index -->
<ng-template #browselink let-value="value">
  <a class="dont-break-out preserve-line-breaks ds-browse-link"
     [routerLink]="['/browse', browseDefinition.id]"
     [queryParams]="getQueryParams(value)" role="link" tabindex="0">{{value}}</a>
</ng-template>

<!-- Render value with ORCID badge and clickable link to ORCID profile -->
<ng-template #orcidTemplate let-value="value" let-mdValue="mdValue">
  <span class="orcid-author">
    <a class="dont-break-out preserve-line-breaks ds-orcid-link"
       [href]="getOrcidUrl(mdValue.authority)"
       target="_blank"
       rel="noopener noreferrer"
       role="link"
       tabindex="0"
       [title]="'View ORCID profile for ' + value">
      {{value}}
    </a>
    <a class="orcid-badge"
       [href]="getOrcidUrl(mdValue.authority)"
       target="_blank"
       rel="noopener noreferrer"
       [title]="'ORCID ID: ' + mdValue.authority">
      <img src="https://orcid.org/sites/default/files/images/orcid_16x16.png" 
           alt="ORCID iD icon" 
           class="orcid-icon">
    </a>
  </span>
</ng-template>
