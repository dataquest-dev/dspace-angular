<form class="d-flex justify-content-between"
      [formGroup]="searchForm"
      (ngSubmit)="submit(searchForm.value); $event.stopImmediatePropagation();" >
  <div>
    <label for="scope" class="sr-only">Search scope</label>
    <select name="scope" id="scope" formControlName="scope" class="form-control" aria-label="Search scope">
      <option value="metadata">{{labelPrefix + 'search.scope.metadata' | translate}}</option>
      <option value="email">{{labelPrefix + 'search.scope.email' | translate}}</option>
    </select>
  </div>
  <div class="flex-grow-1 mr-3 ml-3">
    <div class="form-group input-group">
      <label for="query" class="sr-only">{{labelPrefix + 'search.input' | translate}}</label>
      <input type="text" name="query" id="query" formControlName="query"
             class="form-control" [attr.aria-label]="labelPrefix + 'search.input' | translate">
      <span class="input-group-append">
        <button type="submit" class="search-button btn btn-primary">
          <i class="fas fa-search"></i> {{ labelPrefix + 'search.button' | translate }}
        </button>
      </span>
    </div>
  </div>
  <div>
    <button type="button" class="search-button btn btn-secondary" (click)="submit(null); reset()">
      {{ labelPrefix + 'button.see-all' | translate }}
    </button>
  </div>
</form>
