<form class="w-100" [formGroup]="formData" (ngSubmit)="submitForm(formData.value)">
<div class="mb-3">
  <div class="row">
    <div class="col-sm-12 col-md-6">
      <label for="starts-with-text-input" class="visually-hidden">{{'browse.startsWith.input' | translate}}</label>
      <div class="mb-2 input-group">
        <input id="starts-with-text-input" class="form-control" [attr.aria-label]="'browse.startsWith.input' | translate" placeholder="{{'browse.search-form.placeholder' | translate}}" type="text" name="startsWith" formControlName="startsWith" [value]="getStartsWith()" />
        <button class="btn btn-primary" type="submit" role="button" tabindex="0"><i class="fas fa-book-open"></i> {{'browse.startsWith.submit' | translate}}</button>
      </div>
    </div>
  </div>
  <small class="text-muted">{{'browse.startsWith.type_text' | translate}}</small>
</div>
</form>
