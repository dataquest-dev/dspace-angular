# DSpace Docker image build for hub.docker.com
name: Docker images

# Run this Build for all pushes to 'clarin-v9'.
# Also run for PRs to ensure PR doesn't break Docker build process (PRs build, but do not push).
# NOTE: uses "reusable-docker-build.yml" in ufal/clarin-dspace to actually build each of the Docker images
# https://github.com/ufal/clarin-dspace/blob/clarin-v9/.github/workflows/reusable-docker-build.yml
on:
  push:
    branches:
      - clarin-v9
  pull_request:
  workflow_dispatch:

permissions:
  contents: read  # to fetch code (actions/checkout)
  packages: write # to write images to GitHub Container Registry (GHCR)

jobs:
  #############################################################
  # Build/Push the 'ufal/dspace-angular' image ('-dev' tag)
  #############################################################
  dspace-angular:
    # Ensure this job never runs on forked repos. It's only executed for 'ufal/dspace-angular'
    if: github.repository == 'ufal/dspace-angular'
    # Use the reusable-docker-build.yml script from ufal/clarin-dspace repo to build our Docker image
    uses: ufal/clarin-dspace/.github/workflows/reusable-docker-build.yml@clarin-v9
    with:
      build_id: dspace-angular-dev
      image_name: ufal/dspace-angular
      dockerfile_path: ./Dockerfile
      # As this is a development image, its tags are all suffixed with "-dev". Otherwise, it uses the same
      # tagging logic as the primary 'ufal/dspace-angular' image below.
      tags_flavor: suffix=-dev
      run_python_version_script: true
      python_version_script_dest: src/static-files/VERSION_D.html
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}

  #############################################################
  # Build/Push the 'ufal/dspace-angular' image.
  # This is the production ("dist") build, published under the plain (un-suffixed) tag.
  #############################################################
  dspace-angular-dist:
    # Ensure this job never runs on forked repos. It's only executed for 'ufal/dspace-angular'
    if: github.repository == 'ufal/dspace-angular'
    # Use the reusable-docker-build.yml script from ufal/clarin-dspace repo to build our Docker image
    uses: ufal/clarin-dspace/.github/workflows/reusable-docker-build.yml@clarin-v9
    with:
      build_id: dspace-angular
      image_name: ufal/dspace-angular
      dockerfile_path: ./Dockerfile.dist
      run_python_version_script: true
      python_version_script_dest: src/static-files/VERSION_D.html
    secrets:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_ACCESS_TOKEN: ${{ secrets.DOCKER_ACCESS_TOKEN }}
