# DSpace Docker deploy on dataquest servers
name: Deploy DSpace

on:
  workflow_call:
    inputs:
      INSTANCE:
        required: false
        type: string
        default: '4'
      IMPORT:
        required: false
        default: true
        type: boolean
      ERASE_DB:
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      INSTANCE:
        required: true
        default: '4'
        type: choice
        options:
          - '*'
          - '5'
          - '8'
          - '4'
      IMPORT:
        required: false
        default: false
        type: boolean
      ERASE_DB:
        required: false
        default: false
        type: boolean

jobs:
  deploy-4:
    if: inputs.INSTANCE == '*' || inputs.INSTANCE == '4'
    runs-on: dspace-dep-1
    timeout-minutes: 10
    env:
      INSTANCE: '4'
      ENVFILE: /opt/dspace-envs/.env.dspace.dev-5.zcu.pub
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/erase-db
        if: inputs.ERASE_DB
        with:
          INSTANCE: ${{ env.INSTANCE }}
          NAME: dspace-${{ env.INSTANCE }}

      - name: deploy to dev-5
        working-directory: build-scripts/run/
        run: |
          ./start.sh dspace-$INSTANCE
          cd ../..
          # this is not necessary, since extra.yml doesn't contain any new images that weren't pulled within script above
          # docker compose --env-file $ENVFILE -p dspace-$INSTANCE -f docker/docker-compose.yml -f docker/docker-compose-rest.yml -f /opt/dspace-envs/4/extra.yml pull
          docker compose --env-file $ENVFILE -p dspace-$INSTANCE -f docker/docker-compose.yml -f docker/docker-compose-rest.yml -f /opt/dspace-envs/4/extra.yml up -d --no-build

  playwright-after-deploy4:
    runs-on: dspace-test-1
    needs: deploy-4
    timeout-minutes: 45
    if: '!inputs.IMPORT'
    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          repository: dataquest-dev/dspace-ui-tests
          path: dspace-ui-tests
          token: ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: this-repository

      - name: Copy customer config to UI tests repository for merging
        run: |
          cp this-repository/config/config.zcu.ui.tests.json dspace-ui-tests/customer-constants/

      - name: test
        working-directory: dspace-ui-tests/scripts
        env:
          HOME_URL: http://dev-5.pc:84/
          NAME: ZCU
        run: |
          ./test.sh

      - uses: mazoea/ga-maz/end@master
        with:
          CHOWN_DIR: ./
        if: ${{ always() }}

  rest-tests-after-deploy4:
    runs-on: ubuntu-latest
    needs: playwright-after-deploy4
    timeout-minutes: 45
    steps:
      - name: run rest-tests
        run: |
          curl -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" \
          --request POST \
          https://api.github.com/repos/dataquest-dev/\
          dspace-rest-test/actions/workflows/run_unittests.yml/dispatches \
          --data "{\"ref\":\"refs/heads/master\"}" 2> /dev/null

          # wait for it to start
          sleep 30s

          # get result of last job
          RES=$(curl -H "Accept: application/vnd.github.everest-preview+json" -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" https://api.github.com/repos/dataquest-dev/dspace-rest-test/actions/workflows/run_unittests.yml/runs?per_page=1 2> /dev/null | jq .workflow_runs[0].conclusion)

          # while job did not finish, sleep
          while [[ $RES == 'null' ]]; do
            sleep 10s
            RES=$(curl -H "Accept: application/vnd.github.everest-preview+json" -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" https://api.github.com/repos/dataquest-dev/dspace-rest-test/actions/workflows/run_unittests.yml/runs?per_page=1 2> /dev/null | jq .workflow_runs[0].conclusion)
          done;

          echo $RES
          # if last result is not success, return -1 and fail
          if [[ $RES != \"success\" ]]; then
            echo "rest-tests have failed! check appropriate action run"
            exit 1
          fi;


  playwright-after-import4:
    runs-on: ubuntu-latest
    needs: import-4
    if: inputs.IMPORT
    timeout-minutes: 45
    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          repository: dataquest-dev/dspace-ui-tests
          path: dspace-ui-tests
          token: ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: this-repository

      - name: Copy customer config to UI tests repository for merging
        run: |
          cp this-repository/config/config.zcu.ui.tests.json dspace-ui-tests/customer-constants/

      - name: test
        working-directory: dspace-ui-tests/scripts
        env:
          HOME_URL: http://dev-5.pc:84/
          NAME: ZCU
        run: |
          ./test.sh

      - uses: mazoea/ga-maz/end@master
        with:
          CHOWN_DIR: ./
        if: ${{ always() }}

  rest-tests-after-import4:
    runs-on: ubuntu-latest
    needs: playwright-after-import4
    timeout-minutes: 45
    steps:
      - name: run rest-tests
        run: |
          curl -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" \
          --request POST \
          https://api.github.com/repos/dataquest-dev/\
          dspace-rest-test/actions/workflows/run_unittests.yml/dispatches \
          --data "{\"ref\":\"refs/heads/master\"}" 2> /dev/null

          # wait for it to start
          sleep 30s

          # get result of last job
          RES=$(curl -H "Accept: application/vnd.github.everest-preview+json" -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" https://api.github.com/repos/dataquest-dev/dspace-rest-test/actions/workflows/run_unittests.yml/runs?per_page=1 2> /dev/null | jq .workflow_runs[0].conclusion)

          # while job did not finish, sleep
          while [[ $RES == 'null' ]]; do
            sleep 10s
            RES=$(curl -H "Accept: application/vnd.github.everest-preview+json" -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" https://api.github.com/repos/dataquest-dev/dspace-rest-test/actions/workflows/run_unittests.yml/runs?per_page=1 2> /dev/null | jq .workflow_runs[0].conclusion)
          done;

          echo $RES
          # if last result is not success, return -1 and fail
          if [[ $RES != \"success\" ]]; then
            echo "rest-tests have failed! check appropriate action run"
            exit 1
          fi;

  import-4:
    runs-on: dspace-dep-1
    if: inputs.IMPORT && inputs.INSTANCE == '4'
    timeout-minutes: 120
    needs: deploy-4
    env:
      INSTANCE: '4'
    steps:
      - name: vanilla import
        env:
          FNAME: 2024.7.4._zcu_pub_imported.sql
        run: |
          export DATADIR=/opt/dspace-data/zcu-dump/$FNAME
          export DNAME=dspace$INSTANCE
          export DDBNAME=dspacedb$INSTANCE

          echo "====="
          docker stop $DNAME || true

          echo "====="
          # echo Starting vanilla import DB
          docker cp $DATADIR $DDBNAME:/tmp/
          # drop + create + import + cleanup
          docker exec $DDBNAME /bin/bash -c "dropdb -U dspace -p 543$INSTANCE dspace && createdb -U dspace -p 543$INSTANCE --owner=dspace --encoding=UNICODE dspace && psql -p 543$INSTANCE -U dspace -d dspace -f /tmp/$FNAME && rm /tmp/$FNAME"
          echo "====="
          docker start $DNAME
          sleep 60
          docker exec $DNAME /bin/bash -c "cd /dspace/bin && ./dspace database migrate ignored && ./dspace create-administrator -e test@test.edu -f admin -l user -p admin -c en -o dataquest"
          echo "====="
          # new user will not be accepted unless restarted
          docker restart $DNAME
          sleep 60
          echo "====="

      - name: dspace basic command
        run: |
          export DNAME=dspace$INSTANCE
          docker logs -n 50 $DNAME

          echo "dspace version:"
          docker exec $DNAME /bin/bash -c "cd /dspace/bin && ./dspace version"

          echo "dspace cleanup:"
          docker exec $DNAME /bin/bash -c "cd /dspace/bin && ./dspace cleanup -v"

          echo "dspace reindex solr:"
          docker exec $DNAME /bin/bash -c "cd /dspace/bin && ./dspace index-discovery -b"

          echo "dspace reindex OAI-PMH:"
          docker exec $DNAME /bin/bash -c "cd /dspace/bin && ./dspace oai import -c"

      - name: dspace healthcheck
        run: |
          export DNAME=dspace$INSTANCE
          echo "dspace healthcheck:"
          # docker exec $DNAME /bin/bash -c "cd /dspace/bin && ./dspace healthcheck -v"

      - name: dspace basic command
        run: |
          echo "dspace checker:"
          # docker exec $DNAME /bin/bash -c "cd /dspace/bin && ./dspace checker -v -l"

