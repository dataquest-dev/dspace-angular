# DSpace Docker deploy on dataquest servers
name: Deploy DSpace

on:
  workflow_call:
    inputs:
      INSTANCE:
        required: false
        type: string
        default: '2'
      IMPORT:
        required: false
        default: true
        type: boolean
      ERASE_DB:
        required: false
        default: false
        type: boolean

  workflow_dispatch:
    inputs:
      INSTANCE:
        required: true
        default: '2'
        type: choice
        options:
          - '*'
          - '2'
          - '5'
          - '8'
      IMPORT:
        required: true
        default: true
        type: boolean
      ERASE_DB:
        required: false
        default: false
        type: boolean

jobs:
  deploy-2:
    if: inputs.INSTANCE == '*' || inputs.INSTANCE == '2'
    runs-on: dspace-dep-1
    timeout-minutes: 10
    env:
      INSTANCE: '2'
      ENVFILE: /opt/dspace-envs/.env.dspace.dev-5.uk
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/erase-db
        if: inputs.ERASE_DB
        with:
          INSTANCE: ${{ env.INSTANCE }}
          NAME: dspace-${{ env.INSTANCE }}

      - name: deploy to dev-5
        working-directory: build-scripts/run/
        run: |
          ./start.sh dspace-$INSTANCE

  playwright-after-deploy2:
    runs-on: dspace-test-1
    needs: deploy-2
    timeout-minutes: 45
    if: '!inputs.IMPORT'
    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          repository: dataquest-dev/dspace-ui-tests
          path: dspace-ui-tests
          token: ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}

      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: this-repository

      - name: Copy customer config to UI tests repository for merging
        run: |
          cp this-repository/config/config.uk.ui.tests.json dspace-ui-tests/customer-constants/

      - name: test
        working-directory: dspace-ui-tests/scripts
        env:
          HOME_URL: http://dev-5.pc:82/
          NAME: UK
        run: |
          ./test.sh

      - uses: mazoea/ga-maz/end@master
        with:
          CHOWN_DIR: ./
        if: ${{ always() }}

  rest-tests-after-deploy2:
    runs-on: ubuntu-latest
    needs: playwright-after-deploy2
    timeout-minutes: 45
    steps:
      - name: run rest-tests
        run: |
          curl -H "Accept: application/vnd.github.everest-preview+json" \
          -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" \
          --request POST \
          https://api.github.com/repos/dataquest-dev/\
          dspace-rest-test/actions/workflows/run_unittests.yml/dispatches \
          --data "{\"ref\":\"refs/heads/master\"}" 2> /dev/null

          # wait for it to start
          sleep 30s

          # get result of last job
          RES=$(curl -H "Accept: application/vnd.github.everest-preview+json" -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" https://api.github.com/repos/dataquest-dev/dspace-rest-test/actions/workflows/run_unittests.yml/runs?per_page=1 2> /dev/null | jq .workflow_runs[0].conclusion)

          # while job did not finish, sleep
          while [[ $RES == 'null' ]]; do
            sleep 10s
            RES=$(curl -H "Accept: application/vnd.github.everest-preview+json" -H "Authorization: token ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}" https://api.github.com/repos/dataquest-dev/dspace-rest-test/actions/workflows/run_unittests.yml/runs?per_page=1 2> /dev/null | jq .workflow_runs[0].conclusion)
          done;

          echo $RES
          # if last result is not success, return -1 and fail
          if [[ $RES != \"success\" ]]; then
            echo "rest-tests have failed! check appropriate action run"
            exit 1
          fi;
