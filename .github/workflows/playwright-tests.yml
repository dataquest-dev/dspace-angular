name: Playwright tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  playwright-tests:
    runs-on: dspace-test-1
    timeout-minutes: 60
    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          repository: dataquest-dev/dspace-ui-tests
          path: dspace-ui-tests
          token: ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}

      - name: test
        id: test
        working-directory: dspace-ui-tests/scripts
        env:
          HOME_URL: http://dev-6.pc:8603/repository/
          NAME: LINDAT-9
          PASSWORD_ADMIN: ${{ secrets.DSPACE_ADMIN_PASSWORD }}
        run: |
          ./test.sh

      # First of the always() steps: it must not sit behind the upload in the grace window.
      - name: Report that the gate produced no result
        if: ${{ always() && steps.test.outcome != 'success' && steps.test.outcome != 'failure' }}
        run: |
          echo "::error title=End-to-end gate produced no result::The Playwright step ended as '${{ steps.test.outcome }}', which is neither success nor failure, so the suite produced no verdict and this run says nothing about the instance. 'cancelled' is the job time limit or an abort; 'skipped' means an earlier step failed and the suite never started; empty means the job was cancelled before it started. Whatever did run is in the step log; anything the suite wrote should be in the playwright-evidence artifact, if the upload after this step finished."
          exit 1

      - uses: mazoea/ga-maz/end@master
        with:
          CHOWN_DIR: ./
        if: ${{ always() }}

      # Runs after the chown, the results are written by root inside the container.
      - name: Keep the partial results
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        continue-on-error: true
        with:
          name: playwright-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: dspace-ui-tests/test-results
          if-no-files-found: warn
          retention-days: 14
