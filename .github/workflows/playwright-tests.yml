name: Playwright tests

on:
  workflow_dispatch:
  workflow_call:

jobs:
  # timeout-minutes cancels the suite job below, and a cancelled job concludes
  # 'cancelled' whatever its always() steps exit with. Nothing inside that job can
  # turn the run red, so the check runs from a job of its own.
  nightly-result-gate:
    needs: playwright-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Fail when the suite produced no verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/nightly-result-gate.sh

  playwright-tests:
    runs-on: dspace-test-1
    timeout-minutes: 60
    steps:
      - name: Checkout Playwright tests
        uses: actions/checkout@v4
        with:
          repository: dataquest-dev/dspace-ui-tests
          path: dspace-ui-tests
          token: ${{ secrets.DEPLOY_DEV5_GH_ACTION_DISPATCH }}

      - name: test
        working-directory: dspace-ui-tests/scripts
        env:
          HOME_URL: http://dev-6.pc:8603/repository/
          NAME: LINDAT-9
          PASSWORD_ADMIN: ${{ secrets.DSPACE_ADMIN_PASSWORD }}
        run: |
          ./test.sh

      - uses: mazoea/ga-maz/end@master
        with:
          CHOWN_DIR: ./
        if: ${{ always() }}