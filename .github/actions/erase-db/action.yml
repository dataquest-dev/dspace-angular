name: 'Erase dspace db'
description: 'CI/CD Erase db'

inputs:
  INSTANCE:
    description: 'port suffix'
    required: true
    type: string
  NAME:
    description: 'docker compose project name'
    required: true
    type: string

runs:
  using: "composite"
  steps:

    - name: stop and remove containers
      shell: bash
      env:
        INSTANCE: ${{ inputs.INSTANCE }}
      run: |
        docker stop dspacesolr$INSTANCE dspacedb$INSTANCE dspacedb-utilities$INSTANCE dspace$INSTANCE dspace-angular$INSTANCE || true
        docker rm   dspacesolr$INSTANCE dspacedb$INSTANCE dspacedb-utilities$INSTANCE dspace$INSTANCE dspace-angular$INSTANCE || true

    - name: remove volumes
      shell: bash
      env:
        NAME: ${{ inputs.NAME }}
        INSTANCE: ${{ inputs.INSTANCE }}
      run: |
          # # condition below was found by accident and appears to be useless. Investigate later.
          # be sure to have INSTANCE set
          # if [[ "x${NAME}" != "dspace-" ]]; then
            docker volume rm $(docker volume ls --filter name="${NAME}_" -q) || true
          # fi;
          # also remove volumes from the dspace-utilities project (separate compose project for the utilities DB)
          docker volume rm $(docker volume ls --filter name="dspace-utilities-${INSTANCE}_" -q) || true

