name: 'Erase Database'
description: 'Erase and recreate the DSpace database and clean up database volumes (preserving assetstore)'
inputs:
  INSTANCE:
    description: 'DSpace instance identifier'
    required: true
  NAME:
    description: 'Container name'
    required: true

runs:
  using: "composite"
  steps:
    - name: Erase and recreate database
      shell: bash
      run: |
        export DNAME=${{ inputs.NAME }}
        export DDBNAME=dspacedb${{ inputs.INSTANCE }}
        export PROJECT_NAME=dspace-${{ inputs.INSTANCE }}

        echo "Stopping DSpace container..."
        docker stop $DNAME || true

        echo "Stopping database container..."
        docker stop $DDBNAME || true

        echo "Removing database volumes (preserving assetstore)..."
        # Remove database-specific volumes but keep assetstore
        docker volume rm ${PROJECT_NAME}_pgdata || true
        docker volume rm ${PROJECT_NAME}_postgres_data || true

        echo "Starting database container..."
        docker start $DDBNAME || true

        # Wait for database to be ready
        echo "Waiting for database to be ready..."
        sleep 10

        echo "Creating fresh database..."
        docker exec $DDBNAME /bin/bash -c "createdb -U dspace -p 10563 --owner=dspace --encoding=UNICODE dspace"

        echo "Database erased, volumes cleaned, and recreated successfully (assetstore preserved)"
