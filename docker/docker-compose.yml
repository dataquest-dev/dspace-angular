# Docker Compose for running the DSpace Angular UI for testing/development
# Requires also running a REST API backend (either locally or remotely),
# for example via 'docker-compose-rest.yml'
networks:
  dspacenet:
services:
  dspace-angular:
    restart: unless-stopped
    container_name: dspace-angular${INSTANCE}
    environment:
      TZ: ${TIMEZONE:-Europe/Bratislava}
      DSPACE_UI_SSL: 'false'
      DSPACE_UI_HOST: dspace-angular
      # Use only `4000`, not the {UI_PORT} from the .env because in the container it is always `4000`
      DSPACE_UI_PORT: 4000
      DSPACE_UI_NAMESPACE: ${DSPACE_UI_NAMESPACE:-/}
      DSPACE_REST_SSL: ${DSPACE_SSL:-false}
      DSPACE_REST_HOST: ${DSPACE_HOST:-localhost}
      DSPACE_REST_PORT: ${DSPACE_REST_PORT:-8080}
      DSPACE_REST_NAMESPACE: ${DSPACE_REST_NAMESPACE:-/server}
    image: ${DSPACE_UI_IMAGE:-dataquest/dspace-angular:dspace-7_x}
    volumes:
    - ./config.prod.yml:/app/config/config.prod.yml
#    - ./aai.js:/app/dist/browser/aai.js
#    - ./dspace-ui.json:/app/dspace-ui.json:rw
    build:
      context: ..
      dockerfile: Dockerfile
    # host.docker.internal lets the FE container reach the BE through the host
    # gateway when both are not on the same docker network (typical local-dev
    # case where the FE is just the one container started from this file and
    # the BE is reached at a host port). Docker Desktop on Mac/Windows already
    # injects this; on Linux Docker (>= 20.10) `host-gateway` makes it resolve
    # to the host. In production / pyinfra deploys this is a no-op because the
    # BE is reached via its public DNS name (dev-5.pc etc.), not host.docker.internal.
    extra_hosts:
    - host.docker.internal:host-gateway
    networks:
      dspacenet:
    entrypoint: ${FE_CMD:-/bin/sh -c "pm2-runtime start dspace-ui.json > /dev/null 2> /dev/null"}
    ports:
    - published: 400${INSTANCE}
      target: 4000
      host_ip: ${HOST_IP:-127.0.0.1}
    - published: 987${INSTANCE}
      target: 987${INSTANCE}
      host_ip: ${HOST_IP:-127.0.0.1}
    stdin_open: true
    tty: true
